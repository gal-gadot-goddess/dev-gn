function drawNode(n,i){if(!S.exists[i]||!S.born[i])return;const a=ease((E-S.born[i])/.6),sh=S.shown[i],he=Math.exp(-(E-S.hit[i])*2.4),h=sh===2?350:sh===1?38:n.h,sat=sh===2?70:90;
 g.globalCompositeOperation='lighter';glow(n.x,n.y,n.r*2.7+he*22,h,(.3+.5*he+(sh?.15:0))*a);g.globalCompositeOperation='source-over';
 g.globalAlpha=a;g.save();g.translate(n.x,n.y);const jit=sh===2?Math.sin(E*50)*(1.5*he+.4):0;g.translate(jit,0);
 const gr=g.createRadialGradient(-n.r*.35,-n.r*.4,2,0,0,n.r);gr.addColorStop(0,`hsla(${h},${sat}%,${sh===2?30:58}%,.97)`);gr.addColorStop(1,`hsla(${h},80%,${sh===2?10:20}%,.97)`);g.fillStyle=gr;g.beginPath();g.arc(0,0,n.r,0,7);g.fill();g.strokeStyle=`hsla(${h},100%,${sh===2?60:78}%,.95)`;g.lineWidth=2;g.stroke();
 g.save();g.rotate(E*(i%2?-.7:.7));g.strokeStyle=`hsla(${h},100%,72%,${sh===2?.25:.5})`;g.lineWidth=1.1;g.setLineDash([4,7]);g.beginPath();g.arc(0,0,n.r+7,0,7);g.stroke();g.setLineDash([]);g.restore();
 g.fillStyle='#fff';g.font=`${Math.round(n.r*.85)}px sans-serif`;g.textAlign='center';g.fillText(sh===2?'💀':n.ic,0,n.r*.3);g.restore();
 g.fillStyle=`hsl(${h},95%,${sh===2?68:78}%)`;g.font=`800 8.5px ${MONO}`;g.textAlign='center';g.fillText(n.n+(sh===1?' ⚠':''),n.x,n.y+n.r+15);g.globalAlpha=1}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 /* cascade with per-hop delay */
 NS.forEach((_,i)=>{if(!S.exists[i])return;const comp=status(i);if(comp!==S.shown[i]){if(!S.due[i])S.due[i]=E+(S.dead[i]?0:.32);if(E>=S.due[i]){S.shown[i]=comp;S.due[i]=0;S.hit[i]=E;const n=NS[i];ring(n.x,n.y,comp===0?160:comp===1?38:350);if(comp===1){burst(n.x,n.y,38,8,70);tone({type:'square',f:260+i*30,dur:.08,vol:.04,wet:.2})}}}else S.due[i]=0});
 const tgt=S.shown[0]>=1?14:100;S.ok+=(tgt-S.ok)*(1-Math.exp(-dt*3));upd();
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 const fl=Math.exp(-(E-S.flash)*3),sk=S.shake;S.shake=Math.max(0,S.shake-dt*3);
 const sx=(Math.random()-.5)*7*sk,sy=(Math.random()-.5)*7*sk,cx=Math.sin(E*.31)*3,cy=Math.cos(E*.23)*3;
 g.save();g.translate(sx,sy);
 g.globalCompositeOperation='lighter';glow(120+cx,360+cy,210,265,.14);glow(430-cx,520-cy,220,190,.12);if(S.ok<50)glow(270,420,260,350,.14*(1-S.ok/50));
 STARS.forEach(s=>{const tw=.35+.65*Math.abs(Math.sin(E*.8+s.p));g.fillStyle=`rgba(190,210,255,${.5*tw})`;g.beginPath();g.arc(s.x+cx*.6*s.r,s.y*.62+226+cy*.6*s.r,s.r*.7,0,7);g.fill()});g.globalCompositeOperation='source-over';
 if(S.chip){const w=S.chip.length*6.6+28,fm=Math.exp(-(E-S.chipT)*3),c=S.mon?'55,224,176':'255,180,84';g.fillStyle=`rgba(${c},${.14+.22*fm})`;rr(270-w/2,238,w,20,10);g.fill();g.strokeStyle=`rgba(${c},.9)`;g.lineWidth=1.3;g.stroke();g.fillStyle=`rgb(${c})`;g.font=`800 9.5px ${MONO}`;g.textAlign='center';g.fillText(S.chip,270,251.5)}
 /* edges + request flow */
 ED.forEach(([a,b],ei)=>{if(!S.exists[a]||!S.exists[b]||!S.born[a]||!S.born[b])return;const bad=S.shown[a]===2||S.shown[b]===2,deg=S.shown[a]===1||S.shown[b]===1,col=bad?'350,90%,60%':deg?'38,95%,60%':'170,80%,62%';
  g.strokeStyle=`hsla(${col.split(',')[0]},${col.split(',')[1]},${col.split(',')[2]},${bad?.18:.28})`;g.lineWidth=1.3;g.beginPath();g.moveTo(NS[a].x,NS[a].y);g.lineTo(NS[b].x,NS[b].y);g.stroke();
  if(!bad&&Math.random()<dt*1.1)S.fl.push({a,b,t0:E,dur:.9+Math.random()*.5,deg,rev:Math.random()<.4})});
 NS.forEach(drawNode);
 /* GW success ring */
 if(S.born[0]){g.strokeStyle='rgba(120,150,220,.2)';g.lineWidth=3;g.beginPath();g.arc(NS[0].x,NS[0].y,NS[0].r+14,-Math.PI/2,Math.PI*1.5);g.stroke();g.strokeStyle=S.ok<50?'#ff6a5a':'#37e0b0';g.beginPath();g.arc(NS[0].x,NS[0].y,NS[0].r+14,-Math.PI/2,-Math.PI/2+Math.PI*2*S.ok/100);g.stroke();g.fillStyle=S.ok<50?'#ff8b7c':'#9ff3d9';g.font=`800 8px ${MONO}`;g.textAlign='center';g.fillText(Math.round(S.ok)+'% OK',NS[0].x+54,NS[0].y+3)}
 /* hypothesis */
 if(S.hyp){const n=Math.floor((E-S.hypT)*50),t=S.hyp.slice(0,n),w=Math.min(420,S.hyp.length*6.1+30);g.fillStyle='rgba(8,12,24,.88)';rr(270-w/2,574,w,22,11);g.fill();g.strokeStyle='rgba(177,140,255,.6)';g.lineWidth=1;g.stroke();g.fillStyle='#d9ccff';g.font=`700 9.5px ${MONO}`;g.textAlign='center';g.fillText(t,270,588.5)}
 if(S.verdict){const ok=S.verdict==='PASS',p=ease((E-S.vT)/.3);g.globalAlpha=p;g.fillStyle=ok?'rgba(55,224,176,.9)':'rgba(255,90,80,.92)';rr(270-34,552,68,18,9);g.fill();g.fillStyle=ok?'#06281d':'#fff';g.font=`800 10px ${MONO}`;g.fillText(ok?'PASS ✓':'FAIL ✗',270,564.5);g.globalAlpha=1}
 g.globalCompositeOperation='lighter';
 S.fl=S.fl.filter(f=>E-f.t0<f.dur);for(const f of S.fl){let k=(E-f.t0)/f.dur;if(f.rev)k=1-k;const x=lerp(NS[f.a].x,NS[f.b].x,k),y=lerp(NS[f.a].y,NS[f.b].y,k);glow(x,y,7,f.deg?38:165,.85)}
 /* lightning */
 if(S.bolt&&E-S.bolt.t<.5){const b=S.bolt,k=(E-b.t)/.5,n=NS[b.i],al=(1-k)*(Math.random()<.75?1:.4);
  for(let pass=0;pass<3;pass++){const w=[11,4,1.6][pass],c=[`rgba(120,150,255,${.22*al})`,`rgba(190,210,255,${.7*al})`,`rgba(255,255,255,${al})`][pass];g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.beginPath();let x=b.x0,y=232;g.moveTo(x,y);const N=9;for(let s=1;s<=N;s++){const t=s/N;x=lerp(b.x0,n.x,t)+(s<N?(Math.random()-.5)*34*(1-t*.4):0);y=lerp(232,n.y,t);g.lineTo(x,y)}g.stroke();
   if(pass===1){g.lineWidth=2;for(let br=0;br<3;br++){const t=.3+Math.random()*.5,bx=lerp(b.x0,n.x,t),by=lerp(232,n.y,t);g.beginPath();g.moveTo(bx,by);g.lineTo(bx+(Math.random()-.5)*70,by+20+Math.random()*30);g.stroke()}}}
  glow(n.x,n.y,70*(1-k*.4),230,.8*al);glow(b.x0,232,40,230,.5*al)}
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=80*dt;glow(s.x,s.y,5,s.h,a*.9)}
 S.rg=S.rg.filter(r=>E-r.t<.8);for(const r of S.rg){const a=(E-r.t)/.8;if(a<0)continue;g.strokeStyle=`hsla(${r.h},100%,75%,${(1-a)*.9})`;g.lineWidth=2.2*(1-a)+.5;g.beginPath();g.arc(r.x,r.y,8+a*80,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';g.restore();
 if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(200,215,255,${.16*fl})`;g.fillRect(0,240,540,370);g.globalCompositeOperation='source-over'}
 raf=requestAnimationFrame(frame)}

(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
const setSnd=()=>{muted=!muted;if(master)master.gain.value=muted?0:.62;$('#bSnd').textContent=muted?'🔇 Sound':'🔊 Sound'};
$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
let ht;const showUI=()=>{document.body.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show'),2500)};
addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>17.5)startPlay()},500);
setTimeout(startPlay,180);
