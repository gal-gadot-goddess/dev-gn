<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* REEL-VIZ FORMAT · 9:16 · 540x960 stage · safe zone: x 36-460, y 140-770 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--amber:#ffb454;--mint:#37e0b0;--txt:#e9eff8;--dim:#5e6c84;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--sans:'Outfit',system-ui,-apple-system,sans-serif}
html,body{height:100%;background:#04060b;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#fit{width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:540px;height:960px;transform-origin:center center;overflow:hidden;
background:radial-gradient(120% 70% at 50% -10%,#101a2c 0%,transparent 60%),radial-gradient(80% 50% at 112% 112%,#0f2a26 0%,transparent 60%),radial-gradient(70% 45% at -10% 105%,#2a1c0e 0%,transparent 60%),#0a0e15}
.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(120,150,220,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,220,.05) 1px,transparent 1px);background-size:45px 45px;-webkit-mask-image:radial-gradient(95% 85% at 50% 42%,#000 35%,transparent 100%);mask-image:radial-gradient(95% 85% at 50% 42%,#000 35%,transparent 100%)}
.aur{position:absolute;width:430px;height:430px;border-radius:50%;filter:blur(75px);opacity:.17;pointer-events:none}
.a1{background:#ff9a2e;top:-170px;left:-150px;animation:drift 16s ease-in-out infinite alternate}
.a2{background:#17d6a0;bottom:-150px;right:-130px;animation:drift 19s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(42px,30px) scale(1.12)}}
#grain{position:absolute;inset:0;z-index:40;opacity:.06;pointer-events:none;mix-blend-mode:overlay}
canvas#cv{position:absolute;inset:0;width:540px;height:960px;z-index:3;pointer-events:none}
.rev{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .65s cubic-bezier(.16,1,.3,1)}
.rev.show{opacity:1;transform:none}
#head{position:absolute;left:0;right:0;top:142px;text-align:center;z-index:6}
.kick{font:500 11px/1 var(--mono);letter-spacing:.26em;color:var(--dim)}
.title{margin-top:10px;font:800 40px/1.1 var(--sans);color:var(--txt);text-shadow:0 0 24px rgba(120,160,255,.2)}
.mn{color:var(--amber)}.ci{color:var(--mint)}.vs{color:#6d7c96;font-weight:600;font-size:28px;margin:0 8px}
.sub{margin-top:7px;font:600 13.5px/1 var(--sans);color:#8aa0c8}
.cnt{position:absolute;top:618px;z-index:6;text-align:center;width:150px}
#cL{left:62px}#cR{left:302px}
.cnt .num{font:800 30px/1 var(--sans);color:var(--txt)}
.cnt .lab{margin-top:6px;font:700 9px/1 var(--mono);letter-spacing:.14em;color:#6d7c96}
.cnt .st{margin-top:9px;display:inline-block;padding:4px 8px;border-radius:7px;font:700 9.5px/1 var(--mono);letter-spacing:.08em;opacity:0;transition:opacity .4s}
.cnt .st.show{opacity:1}
#stL{color:#ff7a6a;border:1.3px solid rgba(255,122,106,.6);background:rgba(255,122,106,.08)}
#stR{color:var(--mint);border:1.3px solid rgba(55,224,176,.6);background:rgba(55,224,176,.07)}
#punch{position:absolute;left:0;right:0;top:712px;text-align:center;z-index:6;opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,1.3,.3,1)}
#punch.show{opacity:1;transform:none}
#punch div{font:800 22px/1.25 var(--sans)}
#fx{position:absolute;inset:0;z-index:8;pointer-events:none}
.flt{position:absolute;transform:translate(-50%,-50%);font:700 11px/1 var(--mono);letter-spacing:.08em;white-space:nowrap;padding:5px 9px;border-radius:8px;background:rgba(8,12,24,.84);border:1.3px solid currentColor;animation:flt 1.9s ease-out forwards}
@keyframes flt{0%{opacity:0;margin-top:8px}15%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-18px}}
#guide{position:absolute;inset:0;z-index:50;pointer-events:none;display:none;background:linear-gradient(rgba(255,40,90,.16) 0 140px,transparent 140px 770px,rgba(255,40,90,.16) 770px);box-shadow:inset -80px 0 0 rgba(255,40,90,.16),inset 36px 0 0 rgba(255,40,90,.16)}
.ui{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:99;display:flex;gap:4px;opacity:0;transition:opacity .4s}
body.show .ui,.ui.keep{opacity:1}
.ui button{background:#1b1d33;color:#cfd4ea;border:1px solid #333a62;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div id="fit"><div id="stage">
<div class="aur a1"></div><div class="aur a2"></div><div class="grid"></div>
<canvas id="cv" width="1080" height="1920"></canvas>
<header id="head">
 <div class="kick rev" id="kick">@yourhandle · VIZ 12</div>
 <h1 class="title rev" id="title"><span class="mn">Docker</span> <span class="ci">Layer Cache</span></h1>
 <div class="sub rev" id="sub">why a build takes 3 seconds. or 3 minutes.</div>
</header>
<div class="cnt rev" id="cL"><div class="num" id="nL">0s</div><div class="lab" id="rL">BUILD TIME</div><div class="st" id="stL">CACHE BUSTED ✗</div></div>
<div class="cnt rev" id="cR"><div class="num" id="nR">0</div><div class="lab" id="rR">LAYERS REUSED</div><div class="st" id="stR">3 LAYERS REUSED ⚡</div></div>
<div id="punch"><div class="mn">Change a layer: all below rebuild.</div><div class="ci">Rarely-changing steps go first.</div></div>
<div id="fx"></div><div id="guide"></div><div id="grain"></div>
</div></div>
<div class="ui" id="ui"><button id="bSnd">🔊 Sound</button><button id="bMus">♪ Music</button><button id="bRep">↻ Replay</button><button id="bGd">Safe zones</button></div>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s),stage=$('#stage'),fx=$('#fx'),cv=$('#cv'),g=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,ease=x=>1-Math.pow(1-clamp(x),3),ss=x=>{x=clamp(x);return x*x*(3-2*x)};
const NOTES=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,784,880,1046.5,1174.66];
const QS=new URLSearchParams(location.search);
let sc=1;function fit(){sc=Math.min(innerWidth/540,innerHeight/960);stage.style.transform=`scale(${sc})`}
addEventListener('resize',fit);fit();

/* ===== AUDIO: fully synthesized ===== */
let ac=null,master,sfxBus,musBus,rev,muted=false,musicOn=QS.get('music')!=='0',A0=0,start=0,playing=false;
function audioInit(){if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 ac=new AC();master=ac.createGain();master.gain.value=.62;
 const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=6;master.connect(comp);comp.connect(ac.destination);
 sfxBus=ac.createGain();sfxBus.connect(master);
 rev=ac.createConvolver();const n=ac.sampleRate*1.7|0,b=ac.createBuffer(2,n,ac.sampleRate);
 for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}
 rev.buffer=b;const rg=ac.createGain();rg.gain.value=.3;rev.connect(rg);rg.connect(master);newBus()}
function newBus(){if(musBus)musBus.gain.setTargetAtTime(0,ac.currentTime,.05);musBus=ac.createGain();musBus.gain.value=.7;
 musBus.connect(master);const s=ac.createGain();s.gain.value=.35;musBus.connect(s);s.connect(rev)}
const TN=()=>ac?Math.max(ac.currentTime,A0+(performance.now()-start)/1000):0;
function out(node,o){const p=ac.createStereoPanner?ac.createStereoPanner():null;if(p){p.pan.value=o.pan||0;node.connect(p);node=p}
 node.connect(o.bus||sfxBus);if(o.wet!==0){const w=ac.createGain();w.gain.value=o.wet==null?.25:o.wet;node.connect(w);w.connect(rev)}}
function tone(o={}){if(!ac||muted)return;const{type='sine',f=440,f2=null,dur=.12,vol=.15,at=0,atk=.008}=o,t0=o.abs!=null?o.abs:TN()+at;
 const osc=ac.createOscillator();osc.type=type;osc.frequency.setValueAtTime(f,t0);if(f2)osc.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+dur);
 const gn=ac.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+atk);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 osc.connect(gn);out(gn,o);osc.start(t0);osc.stop(t0+dur+.06)}
function noise(o={}){if(!ac||muted)return;const{dur:d0=.4,vol=.2,at=0,f0=400,f1=2000,q=1.2,ft='bandpass'}=o,dur=d0,t0=o.abs!=null?o.abs:TN()+at;
 const len=Math.max(1,(dur+.05)*ac.sampleRate|0),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const n=ac.createBufferSource();n.buffer=buf;const f=ac.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
 const gn=ac.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+dur*.2);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 n.connect(f);f.connect(gn);out(gn,o);n.start(t0);n.stop(t0+dur+.05)}
const sfx={
 ui(){tone({f:640,dur:.05,vol:.05,wet:.1})},
 thump(){tone({f:130,f2:38,dur:.45,vol:.6,wet:.1});tone({type:'triangle',f:520,f2:70,dur:.12,vol:.1})},
 zap(){tone({type:'sawtooth',f:2100,f2:160,dur:.2,vol:.14});noise({dur:.14,vol:.05,f0:3000,f1:600})},
 whoosh(d=.5,v=.12){noise({dur:d,vol:v,f0:300,f1:2600})},
 passL(w){tone({type:'square',f:150+w*38,dur:.1,vol:.04,pan:-.5,wet:0});noise({dur:.05,vol:.03,f0:2400,f1:900,pan:-.5})},
 passR(n){tone({type:'triangle',f:NOTES[n%9+3],dur:.09,vol:.06,pan:.5,wet:.3});noise({dur:.03,vol:.015,f0:8000,f1:6000,ft:'highpass',pan:.5,wet:0})},
 chime(n,pan){tone({type:'triangle',f:NOTES[(n*2)%8+4]*2,dur:.4,vol:.07,pan,wet:.45});tone({f:NOTES[(n*2)%8+4],dur:.4,vol:.05,pan,wet:.3})},
 fail(){noise({dur:.22,vol:.16,f0:5000,f1:400,q:.8,pan:.5});tone({type:'sawtooth',f:900,f2:90,dur:.2,vol:.11,pan:.5});tone({type:'triangle',f:330,dur:.14,vol:.1,at:.1,pan:.5});tone({type:'triangle',f:247,dur:.24,vol:.1,at:.24,pan:.5})},
 glitch(){for(let i=0;i<8;i++)tone({type:'square',f:300+((i*7919)%1800),dur:.045,vol:.07,at:i*.05,pan:-.5,wet:0});noise({dur:.45,vol:.12,f0:6000,f1:300,at:.1,pan:-.5})},
 alarm(){for(let i=0;i<4;i++)tone({type:'sawtooth',f:i%2?440:330,dur:.2,vol:.07,at:i*.22,pan:-.4,wet:.2})},
 chord(v=.07){[261.6,329.6,392,523.2,659.3].forEach((f,i)=>tone({type:'triangle',f,dur:1.5,vol:v,at:i*.035,wet:.4}));tone({f:130,f2:60,dur:.6,vol:.28,wet:.1})},
 impact(){tone({f:90,f2:28,dur:.9,vol:.7,wet:.1});noise({dur:.7,vol:.18,f0:2500,f1:80,q:.6});sfx.chord(.08)}
};
function music(){if(!ac||!musicOn)return;const t0=A0,B=.5;
 const CH=[[220,261.6,329.6,110],[174.6,220,261.6,87.3],[261.6,329.6,392,130.8],[196,246.9,293.7,98]];
 CH.forEach((c,i)=>{const t=t0+i*4;
  c.slice(0,3).forEach(f=>[-7,7].forEach(d=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=d;
   const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1500,t+3);
   const gn=ac.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.013,t+1.2);gn.gain.linearRampToValueAtTime(.0001,t+4.3);
   o.connect(lp);lp.connect(gn);gn.connect(musBus);o.start(t);o.stop(t+4.4)}));
  for(let b=0;b<2;b++)tone({abs:t+b*2,f:c[3],dur:1.9,vol:.1,atk:.04,bus:musBus,wet:0})});
 const AR=[440,523.25,659.25,784,659.25,523.25,440,392];
 for(let i=0;i<40;i++){const t=t0+3+i*.25,v=.02+.03*clamp(i/20);if(t>t0+11.6)break;
  tone({abs:t,type:'triangle',f:AR[i%8]*(i%16>=8?2:1),dur:.3,vol:v,bus:musBus,pan:Math.sin(i)*.4,wet:.35})}
 for(let b=0;b<17;b++){const t=t0+3+b*B;tone({abs:t,f:135,f2:42,dur:.22,vol:.2,bus:musBus,wet:0});
  noise({abs:t+B/2,dur:.05,vol:.018,f0:9000,f1:7000,q:.8,ft:'highpass',bus:musBus,wet:0})}
 noise({abs:t0+11.7,dur:.85,vol:.16,f0:300,f1:7000,q:1.5,bus:musBus});
 tone({abs:t0+11.7,type:'sawtooth',f:200,f2:1600,dur:.85,vol:.04,bus:musBus})}

/* ===== scene: Dockerfile -> layer chain ===== */
const CODE=[['FROM','node:20'],['COPY','package.json .'],['RUN','npm install'],['COPY','. .'],['CMD','["node","app.js"]']];
const KC={FROM:'#b18cff',COPY:'#5aa2ff',RUN:'#ffb454',CMD:'#ff7fa3'},SZ=['64MB','12KB','180MB','2MB','0B'],D=[.4,.35,1.1,.35,.25];
const RY=i=>284+i*58,BX=252,BW=196,BH=46,CXB=40,CW=198,SPD=14;
const SPR={};function spr(h){const k=Math.round(h/10)*10;if(!SPR[k]){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,`hsla(${k},100%,88%,1)`);r.addColorStop(.25,`hsla(${k},100%,64%,.55)`);r.addColorStop(1,`hsla(${k},100%,50%,0)`);x.fillStyle=r;x.fillRect(0,0,64,64);SPR[k]=c}return SPR[k]}
function glow(x,y,r,h,a){if(a<.01)return;g.globalAlpha=Math.min(1,a);g.drawImage(spr(h),x-r,y-r,2*r,2*r);g.globalAlpha=1}
let S,E=0,events=[],raf=null,lastF=0;
function fresh(){S={sp:[],rg:[],on:0,ly:CODE.map(()=>({st:'empty',t0:0,dur:1,hit:-9})),edit:[-9,-9,-9,-9,-9].map(()=>0),bt:0,cached:0,tag:'',flash:-9,last:''}}
function at(t,fn){events.push({t,fn});events.sort((a,b)=>a.t-b.t)}
function flt(txt,x,y,col){const d=document.createElement('div');d.className='flt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;fx.appendChild(d);setTimeout(()=>d.remove(),1950)}
function ring(x,y,h){S.rg.push({x,y,h,t:E})}
function burst(x,y,h,n=14){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=30+Math.random()*110;S.sp.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6+Math.random()*.4,t:E,h:h+Math.random()*30-15})}}
const BC=i=>[BX+BW/2,RY(i)+BH/2];
function upd(){const k=Math.round(S.bt)+'|'+S.cached;if(k===S.last)return;S.last=k;$('#nL').textContent=Math.round(S.bt)+'s';$('#nR').textContent=S.cached}
function cacheHit(i){const l=S.ly[i];l.st='cached';l.hit=E;S.cached++;const c=BC(i);ring(c[0],c[1],215);burst(c[0],c[1],215,10);tone({type:'triangle',f:NOTES[5+i%3]*2,dur:.14,vol:.08,pan:.2,wet:.4})}
function startL(i){const l=S.ly[i];l.st='build';l.t0=E;l.dur=D[i];sfx.passL(i);if(i===2)noise({dur:D[i],vol:.07,f0:400,f1:3000,pan:-.2})}
function doneL(i){const l=S.ly[i];l.st='done';l.hit=E;const c=BC(i);ring(c[0],c[1],160);sfx.chime(i+1,.2)}
function bust(i){S.ly[i].st='bust';S.ly[i].hit=E;const c=BC(i);burst(c[0],c[1]-BH/2,350,14);ring(c[0],c[1],350);tone({type:'sawtooth',f:700,f2:120,dur:.14,vol:.07,pan:.2});S.flash=E}
function build(t0,n,tag){let t=t0;at(t0,()=>{S.bt=0;S.cached=0;S.tag=tag;S.edit=S.edit.map(()=>0);sfx.zap()});
 for(let i=0;i<n;i++){const k=i;at(t,()=>cacheHit(k));t+=.12}
 if(n>0&&n<5){for(let i=n;i<5;i++){const k=i;at(t+(i-n)*.08,()=>bust(k))}t+=(5-n)*.08+.05}
 for(let i=n;i<5;i++){const k=i,s0=t;at(s0,()=>startL(k));t+=D[i];at(t,()=>doneL(k))}return t}
function buildTimeline(){const a=at;
 a(.2,()=>{$('#kick').classList.add('show');sfx.ui()});
 a(.55,()=>{$('#title').classList.add('show');sfx.thump()});
 a(1.0,()=>{$('#sub').classList.add('show');sfx.ui()});
 a(1.5,()=>{S.on=E;sfx.zap();sfx.whoosh(.5,.1)});
 a(2.6,()=>{$('#cL').classList.add('show');$('#cR').classList.add('show');sfx.chord(.035)});
 a(3.0,()=>flt('first build: nothing cached',270,300,'#e9eff8'));
 build(3.2,0,'BUILD #1 · COLD');
 a(5.9,()=>flt('every layer built from scratch',270,300,'#ffb454'));
 a(6.3,()=>{S.edit[3]=E;sfx.ui();flt('✎ edit app code',CXB+CW/2,RY(3)-16,'#ffd08a')});
 build(7.0,3,'BUILD #2 · CODE CHANGED');
 a(7.5,()=>flt('layers 1–3 reused ⚡',270,300,'#5aa2ff'));
 a(8.3,()=>{$('#stR').classList.add('show');sfx.chord(.05)});
 a(8.6,()=>{S.edit[1]=E;sfx.ui();flt('✎ edit package.json',CXB+CW/2,RY(1)-16,'#ffd08a')});
 build(9.1,1,'BUILD #3 · DEPS CHANGED');
 a(9.7,()=>flt('chain snaps: all below rebuild',270,300,'#ff7a6a'));
 a(11.4,()=>{$('#stL').classList.add('show');S.flash=E});
 a(11.7,()=>sfx.whoosh(.85,.1));
 a(12.5,()=>{$('#punch').classList.add('show');sfx.impact();S.flash=E});
}
function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');
 $('#stL').classList.remove('show');$('#stR').classList.remove('show');fx.innerHTML='';S.last='';upd()}
function startPlay(){fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ===== render ===== */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const MONO='"JetBrains Mono",ui-monospace,monospace';
function drawRow(i){const y=RY(i),ra=ease((E-S.on-i*.15)/.5)*(S.on>0?1:0);if(ra<=0)return;const l=S.ly[i],ed=S.edit[i]>0,fe=Math.exp(-(E-l.hit)*3);
 g.globalAlpha=ra;g.save();g.translate((1-ra)*-14,0);
 /* code line */
 g.fillStyle=ed?'rgba(255,208,138,.14)':'rgba(16,24,42,.9)';rr(CXB,y,CW,BH,9);g.fill();g.strokeStyle=ed?'rgba(255,208,138,.9)':'rgba(120,150,220,.28)';g.lineWidth=ed?1.8:1;g.stroke();
 g.textAlign='left';g.fillStyle='#4b5873';g.font=`700 9px ${MONO}`;g.fillText(i+1,CXB+8,y+BH/2+3);
 g.fillStyle=KC[CODE[i][0]];g.font=`800 12px ${MONO}`;g.fillText(CODE[i][0],CXB+24,y+BH/2+4);
 g.fillStyle='#dfe8f7';g.font=`500 11px ${MONO}`;g.fillText(CODE[i][1],CXB+24+CODE[i][0].length*7.6+8,y+BH/2+4);
 if(ed){g.fillStyle='#ffd08a';g.font=`800 8px ${MONO}`;g.textAlign='right';g.fillText('✎ CHANGED',CXB+CW-8,y+11)}
 /* arrow */
 g.strokeStyle='rgba(120,150,220,.4)';g.lineWidth=1.4;g.beginPath();g.moveTo(CXB+CW+3,y+BH/2);g.lineTo(BX-4,y+BH/2);g.stroke();g.beginPath();g.moveTo(BX-8,y+BH/2-3);g.lineTo(BX-3,y+BH/2);g.lineTo(BX-8,y+BH/2+3);g.stroke();
 /* layer block */
 let rgb='120,150,220',fa=.05,txt='',dash=true;
 if(l.st==='build'){rgb='255,180,84';fa=.1;txt='BUILDING';dash=false}else if(l.st==='done'){rgb='55,224,176';fa=.2;txt='✓ BUILT';dash=false}
 else if(l.st==='cached'){rgb='90,162,255';fa=.28;txt='⚡ CACHED';dash=false}else if(l.st==='bust'){rgb='255,100,90';fa=.22;txt='✗ INVALID';dash=false}
 g.fillStyle=`rgba(${rgb},${fa+.25*fe})`;rr(BX,y,BW,BH,9);g.fill();
 if(l.st==='build'){const p=clamp((E-l.t0)/l.dur);g.save();rr(BX,y,BW,BH,9);g.clip();g.fillStyle='rgba(255,180,84,.42)';g.fillRect(BX,y,BW*p,BH);g.fillStyle='rgba(255,230,170,.9)';g.fillRect(BX+BW*p-2,y,2,BH);g.restore();txt=`BUILDING ${Math.round(p*100)}%`}
 g.strokeStyle=`rgba(${rgb},${dash?.3:.95})`;g.lineWidth=dash?1:1.8+fe;if(dash)g.setLineDash([3,4]);rr(BX,y,BW,BH,9);g.stroke();g.setLineDash([]);
 g.textAlign='left';g.fillStyle=`rgba(${rgb},${dash?.5:.95})`;g.font=`800 10px ${MONO}`;g.fillText('LAYER '+(i+1),BX+10,y+BH/2-3);
 g.fillStyle='rgba(200,215,240,.6)';g.font=`500 9px ${MONO}`;g.fillText(SZ[i]+' · a'+(3+i*7)+'f'+(i+2),BX+10,y+BH/2+10);
 g.textAlign='right';g.fillStyle=`rgba(${dash?'120,150,220':rgb},${dash?.5:1})`;g.font=`800 10px ${MONO}`;g.fillText(txt,BX+BW-10,y+BH/2+4);
 g.restore();
 /* chain link to next */
 if(i<4){const n=S.ly[i+1],lx=BX+BW/2,ly=y+BH,ok=n.st==='done'||n.st==='cached',bad=n.st==='bust',cc=ok?(n.st==='cached'?'90,162,255':'55,224,176'):bad?'255,100,90':'120,150,220';
  g.strokeStyle=`rgba(${cc},${ok||bad?.95:.3})`;g.lineWidth=2.4;g.beginPath();
  if(bad){g.moveTo(lx,ly);g.lineTo(lx-3,ly+4);g.moveTo(lx+3,ly+7);g.lineTo(lx,ly+12)}else{g.moveTo(lx,ly);g.lineTo(lx,ly+12)}g.stroke()}
 g.globalAlpha=1}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 if(S.ly.some(l=>l.st==='build'))S.bt+=dt*SPD;upd();
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 if(S.tag){const w=S.tag.length*7+26,fl=Math.exp(-(E-S.flash)*3);g.fillStyle=`rgba(177,140,255,${.14+.2*fl})`;rr(270-w/2,246,w,22,11);g.fill();g.strokeStyle='rgba(177,140,255,.8)';g.lineWidth=1.2;g.stroke();g.fillStyle='#e6dcff';g.font=`800 10px ${MONO}`;g.textAlign='center';g.fillText(S.tag,270,260.5)}
 for(let i=0;i<5;i++)drawRow(i);
 g.globalCompositeOperation='lighter';
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=100*dt;glow(s.x,s.y,6,s.h,a)}
 S.rg=S.rg.filter(r=>E-r.t<.65);for(const r of S.rg){const a=(E-r.t)/.65;g.strokeStyle=`hsla(${r.h},100%,72%,${1-a})`;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,6+a*34,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';
 raf=requestAnimationFrame(frame)}

/* ===== grain / controls / boot ===== */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
const setSnd=()=>{muted=!muted;if(master)master.gain.value=muted?0:.62;$('#bSnd').textContent=muted?'🔇 Sound':'🔊 Sound'};
$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
let ht;const showUI=()=>{document.body.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show'),2500)};
addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>17.5)startPlay()},500);
setTimeout(startPlay,180);
})();
