 osc.connect(gn);out(gn,o);osc.start(t0);osc.stop(t0+dur+.06)}

 const len=Math.max(1,(dur+.05)*ac.sampleRate|0),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const n=ac.createBufferSource();n.buffer=buf;const f=ac.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);

/* ===== render ===== */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const MONO='"JetBrains Mono",ui-monospace,monospace';
function drawNode(n,i){const st=S.N[i],a=ease((E-st.on)/.6)*(st.on>0?1:0);if(a<=0)return;const he=Math.exp(-(E-st.hit)*2.2),sc=1+he*.12;
 g.globalCompositeOperation='lighter';glow(n.x,n.y,n.r*2.8+he*26,n.h,(.32+.55*he)*a);g.globalCompositeOperation='source-over';
 g.globalAlpha=a;g.save();g.translate(n.x,n.y);g.scale(sc,sc);
 const gr=g.createRadialGradient(-n.r*.35,-n.r*.4,2,0,0,n.r);gr.addColorStop(0,`hsla(${n.h},90%,${58+he*22}%,.97)`);gr.addColorStop(1,`hsla(${n.h},80%,20%,.97)`);g.fillStyle=gr;g.beginPath();g.arc(0,0,n.r,0,7);g.fill();g.strokeStyle=`hsla(${n.h},100%,78%,.95)`;g.lineWidth=2;g.stroke();
 g.save();g.rotate(E*(i%2?-.7:.7));g.strokeStyle=`hsla(${n.h},100%,72%,.55)`;g.lineWidth=1.2;g.setLineDash([4,7]);g.beginPath();g.arc(0,0,n.r+8,0,7);g.stroke();g.setLineDash([]);g.restore();
 if(i===1){g.save();g.rotate(E*1.2);for(let k=0;k<6;k++){g.rotate(Math.PI/3);g.strokeStyle=`hsla(${n.h},100%,80%,${.35+.4*he})`;g.lineWidth=2.4;g.beginPath();g.moveTo(n.r+13,0);g.lineTo(n.r+21,0);g.stroke()}g.restore()}
 g.fillStyle='#fff';g.font=`${Math.round(n.r*.8)}px sans-serif`;g.textAlign='center';g.fillText(n.ic,0,n.r*.28);g.restore();
 g.fillStyle=`hsl(${n.h},95%,78%)`;g.font=`800 9px ${MONO}`;g.textAlign='center';g.fillText(n.n,n.x,n.y+n.r+17);
 if(i===2&&S.etcd){const e=ease((E-S.etcd)/.4);g.globalAlpha=a*e;g.fillStyle='#ffd08a';g.font=`700 8px ${MONO}`;g.fillText('replicas: 3',n.x,n.y+n.r+29)}
 g.globalAlpha=1}
function podAt(p){if(p.tw){const t=p.tw,k=ss((E-t.t0)/t.dur);return[lerp(t.fx,t.tx,k),lerp(t.fy,t.ty,k)+t.arc*Math.sin(k*Math.PI)]}if(p.st==='orbit')return orbPos(p,E);return[p.x,p.y]}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 S.ms+=(S.msT-S.ms)*(1-Math.exp(-dt*5));upd();
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 const fl=Math.exp(-(E-S.flash)*3);
 /* stars + nebula (parallax) */
 const cx=Math.sin(E*.31)*4,cy=Math.cos(E*.23)*4;
 g.globalCompositeOperation='lighter';glow(110+cx*.5,330+cy*.5,200,265,.16);glow(440-cx*.5,520-cy*.5,220,190,.14);glow(270,640,200,330,.08);
 STARS.forEach(s=>{const tw=.35+.65*Math.abs(Math.sin(E*.8+s.p));g.fillStyle=`rgba(190,210,255,${.5*tw})`;g.beginPath();g.arc(s.x+cx*.6*s.r,s.y*.62+226+cy*.6*s.r,s.r*.7,0,7);g.fill()});g.globalCompositeOperation='source-over';
 g.save();g.translate(cx*1.2,cy*1.2);
 /* chip */
 if(S.chip){const w=S.chip.length*6.6+28,fm=Math.exp(-(E-S.chipT)*3);g.globalAlpha=1;g.fillStyle=`rgba(177,140,255,${.14+.22*fm})`;rr(270-w/2,238,w,20,10);g.fill();g.strokeStyle='rgba(177,140,255,.9)';g.lineWidth=1.3;g.stroke();g.fillStyle='#e6dcff';g.font=`800 9.5px ${MONO}`;g.textAlign='center';g.fillText(S.chip,270,251.5)}
 /* edges */
 EDG.forEach(([a,b])=>{if(!S.N[a].on||!S.N[b].on)return;const c=cpt(a,b),live=S.cm.some(m=>(m.a===a&&m.b===b||m.a===b&&m.b===a)&&E-m.t0<m.dur+.2&&E>m.t0),h=NN[b===1?a:b].h;
  g.strokeStyle=`hsla(${h},90%,70%,${live?.75:.18})`;g.lineWidth=live?2.6:1.2;g.setLineDash(live?[]:[3,6]);g.lineDashOffset=-E*14;g.beginPath();g.moveTo(NN[a].x,NN[a].y);g.quadraticCurveTo(c[0],c[1],NN[b].x,NN[b].y);g.stroke();g.setLineDash([])});
 /* pending orbit guide */
 if(S.P.some(p=>p.st==='orbit')){g.strokeStyle='rgba(255,200,90,.22)';g.lineWidth=1;g.setLineDash([2,5]);g.beginPath();g.ellipse(NN[1].x,NN[1].y,OR,OR*.8,0,0,7);g.stroke();g.setLineDash([])}
 NN.forEach(drawNode);
 /* pods */
 S.P.forEach((p,i)=>{if(p.st==='off')return;const q=podAt(p),run=p.st==='run',pe=Math.exp(-(E-p.t)*3),hue=run?160:42;g.globalCompositeOperation='lighter';glow(q[0],q[1],run?18+pe*10:15,hue,.8);g.globalCompositeOperation='source-over';
  g.fillStyle=run?'#37e0b0':'#ffc24a';g.beginPath();g.arc(q[0],q[1],6,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=1.3;g.stroke();
  if(p.st==='orbit'){g.fillStyle='#ffd08a';g.font=`800 7px ${MONO}`;g.textAlign='center';g.fillText('Pending',q[0],q[1]-11)}
  if(run){g.fillStyle='#9ff3d9';g.font=`800 7px ${MONO}`;g.textAlign='center';g.fillText('pod-'+(i+1),q[0],q[1]+17)}});
 /* comets */
 g.globalCompositeOperation='lighter';
 S.cm=S.cm.filter(m=>E-m.t0<m.dur+.05);
 for(const m of S.cm){const k=(E-m.t0)/m.dur;if(k<0)continue;for(let j=14;j>=1;j--){const q=qb(m.a,m.b,clamp(k-j*.022));glow(q[0],q[1],5+9*(1-j/14),m.h,.5*(1-j/14))}const q=qb(m.a,m.b,clamp(k));glow(q[0],q[1],24,m.h,1);glow(q[0],q[1],9,m.h,1);
  if(Math.random()<.9)S.sp.push({x:q[0],y:q[1],vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,l:.45,t:E,h:m.h})}
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=60*dt;glow(s.x,s.y,5,s.h,a*.9)}
 S.rg=S.rg.filter(r=>E-r.t<.8);for(const r of S.rg){const a=(E-r.t)/.8;if(a<0)continue;g.strokeStyle=`hsla(${r.h},100%,75%,${(1-a)*.9})`;g.lineWidth=2.2*(1-a)+.5;g.beginPath();g.arc(r.x,r.y,8+a*70,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';
 /* caption */
 if(S.cap){const n=Math.floor((E-S.capT)*52),t=S.cap.slice(0,n);g.textAlign='center';g.font=`700 10px ${MONO}`;const w=Math.min(400,S.cap.length*6.3+24);g.fillStyle='rgba(8,12,24,.85)';rr(270-w/2,598,w,18,9);g.fill();g.strokeStyle='rgba(177,140,255,.5)';g.lineWidth=1;g.stroke();g.fillStyle='#d9ccff';g.fillText(t,270,610.5)}
 g.restore();
 if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.1*fl})`;g.fillRect(0,240,540,370);g.globalCompositeOperation='source-over'}
 raf=requestAnimationFrame(frame)}
