  g.fillStyle='#8aa0c8';g.font=`600 10px ${MONO}`;g.fillText(n+':',CXX+16,ry+11);g.fillStyle=hand?'#ffd08a':'#e9eff8';g.font=`800 10.5px ${MONO}`;g.fillText(String(V[k]),CXX+120,ry+11);
  if(isC&&hand){g.fillStyle='#ffb454';g.font=`800 8px ${MONO}`;g.textAlign='right';g.fillText('✎ changed by hand',CXX+CW-14,ry+11);g.textAlign='left'}

 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;

 if(S.ph===2&&S.agent&&E-S.tick>=1){S.tick=E;S.pk.push({A:[270,GY+104],B:[270,409],h:160,t0:E,dur:.3});sfx.ui();
  if(KEYS.some(([,k])=>diff(k))){const man=KEYS.some(([,k])=>S.hand[k]);if(man&&S.manT)S.tm=(E-S.manT).toFixed(1)+'s';flt('≠ drift detected',270,409-36,'#ff7a6a');sfx.alarm();S.dr=E;at(E+.5,()=>{sync();S.hand={};S.man=0;flt('auto-sync: back to git ✓',270,409-36,'#37e0b0');const ok=!KEYS.some(([,k])=>diff(k));if(ok&&S.G.rep===5){$('#stR').classList.add('show');S.flash=E;sfx.chord(.06)}})}}
 upd();
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';

  card(GY,'GIT REPO · desired state','📁','177,140,255',S.G,S.gT,false);

  /* middle */
  const p1=S.ph===1;g.strokeStyle=p1?'rgba(255,180,84,.5)':'rgba(55,224,176,.5)';g.lineWidth=2;g.setLineDash([4,5]);g.lineDashOffset=p1?-E*30:E*30;g.beginPath();g.moveTo(270,GY+104);g.lineTo(270,CYY);g.stroke();g.setLineDash([]);
  g.fillStyle='#7f8fae';g.font=`800 8.5px ${MONO}`;g.textAlign='left';g.fillText(p1?'CI/CD  ▼ push':'▲ pull',286,GY+104+26);
  const ag=p1?0:1;g.globalAlpha=fa*(p1?.35:1);const ae=Math.exp(-(E-S.dr)*2),rb=p1?'120,150,220':'55,224,176';g.fillStyle=`rgba(${rb},${.14+.2*ae})`;g.beginPath();g.arc(270,409,22,0,7);g.fill();g.strokeStyle=`rgb(${rb})`;g.lineWidth=2;g.stroke();
  if(!p1){g.strokeStyle='rgba(55,224,176,.6)';g.lineWidth=2;g.beginPath();g.arc(270,409,28,E*3,E*3+1.6);g.stroke()}
  g.fillStyle='#fff';g.font='18px sans-serif';g.textAlign='center';g.fillText('🔄',270,416);g.fillStyle=`rgb(${rb})`;g.font=`800 7.5px ${MONO}`;g.fillText(p1?'NO AGENT':'SYNC AGENT',270,448);g.globalAlpha=fa;
  /* pods */
  for(let i=0;i<5;i++){const x=372+i*16,y=CYY+90,live=i<S.C.rep,oe=Math.exp(-(E-S.outage)*1.5);g.fillStyle=live?(oe>.3?`rgba(255,90,80,${oe})`:'#37e0b0'):'rgba(120,150,220,.15)';g.beginPath();g.arc(x,y,5,0,7);g.fill()}
  g.fillStyle='#7f8fae';g.font=`700 7.5px ${MONO}`;g.textAlign='left';g.fillText('pods',CXX+16,CYY+96);
  if(fl>.02){g.globalAlpha=1;g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.1*fl})`;g.fillRect(0,240,540,370);g.globalCompositeOperation='source-over'}
  g.globalAlpha=1}
 g.globalCompositeOperation='lighter';
 S.pk=S.pk.filter(p=>E-p.t0<p.dur+.02);
 for(const p of S.pk){const k=(E-p.t0)/p.dur;if(k<0)continue;const e=ss(k),x=lerp(p.A[0],p.B[0],e),y=lerp(p.A[1],p.B[1],e);glow(x,y,15,p.h,.95);for(let j=1;j<4;j++){const q=ss(k-j*.08);glow(lerp(p.A[0],p.B[0],q),lerp(p.A[1],p.B[1],q),8,p.h,.3/j*2)}}
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=100*dt;glow(s.x,s.y,6,s.h,a)}
 S.rg=S.rg.filter(r=>E-r.t<.65);for(const r of S.rg){const a=(E-r.t)/.65;g.strokeStyle=`hsla(${r.h},100%,72%,${1-a})`;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,6+a*34,0,7);g.stroke()}
